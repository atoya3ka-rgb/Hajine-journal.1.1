">入力すると自動保存されます</div><p class="hint">マーカーや文字色は文字を選択してからボタンを押してね。右下の「やり直し」は直前の操作を元に戻すボタンです（この試作版の意味）。</p></div></section>

const $=id=>document.getElementById(id),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let db,activeDate=today(),currentTab='write',comfort='',savedSelection=null,readIndex=0,pages=[],saveTimer=null,dirty=false,history=[];let settings={theme:'light',scale:100};const fields=['title','weather','temperature','room'];

  const meta=[p.weather,p.temperature?'体温 '+p.temperature+'℃':'',p.room?'室温 '+p.room+'℃':'',p.comfort].filter(Boolean).join('　');
  c.fillText(meta,margin,160);
  for(let i=0;i<rows;i++){
    c.strokeStyle=dark?'#4a4751':'#e8dfd4';c.lineWidth=1;
    c.beginPath();c.moveTo(margin,start+(i+1)*line);c.lineTo(width-margin,start+(i+1)*line);c.stroke();
  }
  for(const pos of positions){
    if(pos.row>=rows)break;
    if(pos.kind==='rule'){
      const cy=start+(pos.row+.6)*line;
      c.strokeStyle=dark?'#938994':'#c6aeb0';c.lineWidth=2;
      c.beginPath();c.moveTo(margin,cy);c.lineTo(width-margin,cy);c.stroke();continue;
    }
    const {ch,x,row,fs,w,style:st}=pos,y=start+(row+1)*line-13;
    c.font=`${st.bold?'bold ':''}${fs}px sans-serif`;
    if(st.bg){c.fillStyle=st.bg;c.fillRect(x,y-fs+3,w,fs+7)}
    c.fillStyle=st.color||ink;c.fillText(ch,x,y);
    if(st.strike){c.strokeStyle='#d44554';c.lineWidth=2;c.beginPath();c.moveTo(x,y-fs/2);c.lineTo(x+w,y-fs/2);c.stroke()}
  }
  canvas.toBlob(blob=>{if(blob)download(blob,`はじね_${p.date}.png`);else alert('画像生成に失敗しました')},'image/png');
}
async function init(){db=await openDB();settings={...settings,...(await get('settings','general')||{})};applySettings();await load(activeDate);await refreshPages();document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));fields.forEach(f=>$(f).addEventListener('input',schedule));$('date').addEventListener('change',e=>load(e.target.value));document.querySelectorAll('#comfort button').forEach(b=>b.addEventListener('click',()=>{comfort=comfort===b.dataset.val?'':b.dataset.val;updateComfort();schedule()}));$('editor').addEventListener('input',()=>{checkpoint();schedule()});$('editor').addEventListener('change',schedule);$('editor').addEventListener('click',e=>{if(e.target.matches('input[type=checkbox]'))schedule()});document.querySelectorAll('#toolbar button').forEach(b=>{b.addEventListener('pointerdown',()=>{let s=window.getSelection();if(s.rangeCount)savedSelection=s.getRangeAt(0).cloneRange()});b.addEventListener('click',()=>exec(b.dataset.cmd))});$('manual-save').onclick=async()=>{await save();$('save-status').textContent='✓ 手動保存しました'};$('undo').onclick=undo;$('screenshot').onclick=screenshot;$('prev').onclick=()=>renderReader(pages[Math.max(0,readIndex-1)].date);$('next').onclick=()=>renderReader(pages[Math.min(pages.length-1,readIndex+1)].date);$('edit-selected').onclick=async()=>{if(pages.length){await load(pages[readIndex].date);await switchTab('write')}};$('query').oninput=renderSearch;$('search-results').onclick=async e=>{let b=e.target.closest('button[data-date]');if(b){await renderReader(b.dataset.date);await switchTab('read');await renderReader(b.dataset.date)}};$('light').onclick=async()=>{settings.theme='light';applySettings();await saveSettings()};$('dark').onclick=async()=>{settings.theme='dark';applySettings();await saveSettings()};$('scale').oninput=async e=>{settings.scale=+e.target.value;applySettings();await saveSettings()};$('export').onclick=async()=>{await save();download(new Blob([JSON.stringify({app:'hajine',version:1,exportedAt:new Date().toISOString(),settings,pages:await allPages()},null,2)],{type:'application/json'}),'はじねバックアップ_'+today()+'.json')};$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='hajine'||!Array.isArray(d.pages))throw Error('はじね用バックアップではありません');if(!confirm(`${d.pages.length}件を復元します。同じ日付は上書きします。よろしいですか？`))return;for(let p of d.pages){if(/^\d{4}-\d\d-\d\d$/.test(p.date))await put('pages',{...p,content:cleanHtml(p.content)})}if(d.settings){settings={...settings,...d.settings};applySettings();await saveSettings()}await refreshPages();await load(activeDate);alert('復元しました')}catch(err){alert('復元に失敗: '+err.message)}e.target.value=''};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}
init().catch(e=>{alert('保存機能を初期化できませんでした。Safariなどの通常ブラウザで開いてください。\n'+e.message)});
